# nginx between Caddy (on the host, terminates HTTPS) and Gunicorn. Published only on 127.0.0.1:8080.
upstream hamsa_app {
    server web:5000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Several scanned case sheets of up to ATTACHMENT_MAX_UPLOAD_MB (10 MB) each can arrive in one upload.
    # Keep in step with request_body max_size in deploy/Caddyfile.*.
    client_max_body_size 60m;
    client_body_timeout 120s;

    location / {
        proxy_pass http://hamsa_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass on the scheme Caddy saw (https in domain mode). nginx's own $scheme is always http here,
        # which would make Django redirect https requests to https again, forever.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Patient files are never public: Django checks the login and role, then answers with
    # "X-Accel-Redirect: /protected-media/<path>" and nginx streams the file from this internal location.
    location /protected-media/ {
        internal;
        alias /app/media/;
        add_header Cache-Control "private, no-store";
        add_header X-Content-Type-Options nosniff;
    }

    # Direct /media/ requests still go to Django's role-checked view (location / above), never to disk.
}
