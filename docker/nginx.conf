# nginx in front of the app (used by docker-compose.nginx.yml). TLS is normally terminated by the host,
# a load balancer, or certbot on this nginx; see README "Deployment".
upstream hamsa_app {
    server web:5000;
}

server {
    listen 80;
    server_name _;

    # Several scanned case sheets of up to ATTACHMENT_MAX_UPLOAD_MB (10 MB) each can arrive in one upload.
    client_max_body_size 60m;
    client_body_timeout 120s;

    location / {
        proxy_pass http://hamsa_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Patient files are never public: Django checks the login and role, then answers with
    # "X-Accel-Redirect: /protected-media/<path>" and nginx streams the file from this internal location.
    location /protected-media/ {
        internal;
        alias /app/media/;
        add_header Cache-Control "private, no-store";
        add_header X-Content-Type-Options nosniff;
    }

    # Direct /media/ requests still go to Django's role-checked view (location / above), never to disk.
}
