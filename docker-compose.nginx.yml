# Optional: put nginx in front of the app (protected file downloads via X-Accel-Redirect, larger uploads).
#   docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d --build
# The app is then served on http://localhost:8080 (nginx); port 5000 is no longer published.
services:
  web:
    ports: !reset []
    environment:
      MEDIA_ACCEL_REDIRECT_PREFIX: /protected-media/
      DJANGO_BEHIND_TLS_PROXY: "true"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped
