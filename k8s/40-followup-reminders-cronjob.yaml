# Daily 08:00 (cluster time): mark yesterday's unattended follow-ups as MISSED, then
# send SMS/WhatsApp reminders for tomorrow's (no-op while SMS_ENABLED/WHATSAPP_ENABLED are "false").
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hamsa-followup-reminders
  namespace: hamsa
spec:
  schedule: "0 8 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: reminders
              image: hamsa-homeo:latest
              imagePullPolicy: IfNotPresent
              command: ["/app/docker/entrypoint.sh", "sh", "-c",
                        "python manage.py mark_missed_followups && python manage.py send_followup_reminders"]
              envFrom:
                - configMapRef: { name: hamsa-config }
                - secretRef: { name: hamsa-secrets }
