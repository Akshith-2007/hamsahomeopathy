apiVersion: v1
kind: ConfigMap
metadata:
  name: hamsa-config
  namespace: hamsa
data:
  DJANGO_DEBUG: "false"
  # Add your own hostname here if you put an Ingress in front.
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,hamsa-web,hamsa-web.hamsa.svc.cluster.local"
  DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:30080,http://localhost:5000"
  # Plain HTTP on a local cluster; set to "true" once TLS terminates in front of the app.
  DJANGO_SECURE_COOKIES: "false"
  POSTGRES_HOST: "hamsa-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "hamsa"
  MEDIA_ROOT: "/app/media"
  TIME_ZONE: "Asia/Kolkata"
  CLINIC_NAME: "Hamsa Homeopathy"
  NOTIFICATION_BACKEND: "core.notifications.ConsoleBackend"
  SMS_ENABLED: "false"
  WHATSAPP_ENABLED: "false"
