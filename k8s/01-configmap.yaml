apiVersion: v1
kind: ConfigMap
metadata:
  name: hamsa-config
  namespace: hamsa
data:
  DJANGO_DEBUG: "false"
  # Add the Ingress hostname (k8s/32-web-ingress.yaml) to both lists, e.g. hamsa.example.com and
  # https://hamsa.example.com.
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,hamsa-web,hamsa-web.hamsa.svc.cluster.local"
  DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:30080,http://localhost:5000"
  # Plain HTTP on a local cluster. Behind the HTTPS Ingress set all four to the values in the comments.
  DJANGO_SECURE_COOKIES: "false"        # "true"
  DJANGO_BEHIND_TLS_PROXY: "false"      # "true"
  DJANGO_SSL_REDIRECT: "false"          # "true"
  DJANGO_HSTS_SECONDS: "0"              # "31536000"
  ATTACHMENT_MAX_UPLOAD_MB: "10"
  WEB_CONCURRENCY: "3"
  LOG_LEVEL: "INFO"
  POSTGRES_HOST: "hamsa-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "hamsa"
  MEDIA_ROOT: "/app/media"
  TIME_ZONE: "Asia/Kolkata"
  CLINIC_NAME: "Hamsa Homeopathy"
  NOTIFICATION_BACKEND: "core.notifications.ConsoleBackend"
  SMS_ENABLED: "false"
  WHATSAPP_ENABLED: "false"
