apiVersion: apps/v1
kind: Deployment
metadata:
  name: hamsa-web
  namespace: hamsa
  labels: { app: hamsa-web }
spec:
  replicas: 1
  strategy:
    type: Recreate   # the media volume is ReadWriteOnce
  selector:
    matchLabels: { app: hamsa-web }
  template:
    metadata:
      labels: { app: hamsa-web }
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      initContainers:
        - name: migrate
          image: hamsa-homeo:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/docker/entrypoint.sh", "python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef: { name: hamsa-config }
            - secretRef: { name: hamsa-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: web
          image: hamsa-homeo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef: { name: hamsa-config }
            - secretRef: { name: hamsa-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: media
              mountPath: /app/media
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 24   # up to 2 minutes for the first start
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: hamsa-media   # uploaded case sheets, reports and images survive pod restarts
