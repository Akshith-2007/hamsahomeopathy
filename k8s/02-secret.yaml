# Development values only. For anything real, create the secret out-of-band:
#   kubectl -n hamsa create secret generic hamsa-secrets \
#     --from-literal=DJANGO_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(50))')" \
#     --from-literal=POSTGRES_USER=hamsa --from-literal=POSTGRES_PASSWORD='<strong password>'
apiVersion: v1
kind: Secret
metadata:
  name: hamsa-secrets
  namespace: hamsa
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "local-k8s-change-me-0d3f9b1c7e5a4b2d9c8e7f6a5b4c3d2e1f0a9b8c"
  POSTGRES_USER: "hamsa"
  POSTGRES_PASSWORD: "hamsa-k8s-password"
