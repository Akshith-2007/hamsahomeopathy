{% load clinic_tags %}{% if page.has_other_pages %}
<nav class="mt-3"><ul class="pagination pagination-sm justify-content-center">
  {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{% url_replace page=page.previous_page_number %}">‹</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">Page {{ page.number }} of {{ page.paginator.num_pages }}</span></li>
  {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{% url_replace page=page.next_page_number %}">›</a></li>{% endif %}
</ul></nav>
{% endif %}
